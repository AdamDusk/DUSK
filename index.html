<style>
:root{
--ivory:#F3EDE2; --black:#14110F; --gold:#B89B6A; --stone:#E3D8C3; --sand:#D8C9AC; --deep:#8C7248;
--serif:'Cormorant Garamond','Times New Roman',serif;
--sans:'Jost','Helvetica Neue',Arial,sans-serif;
--bg:#F3EDE2; --fg:#14110F; --surface:#E3D8C3; --line:#D8C9AC; --link:#8C7248;
--hero-bg:#14110F; --hero-line:#14110F;
color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14110F;--fg:#F3EDE2;--surface:rgba(243,237,226,.06);--line:rgba(243,237,226,.2);--link:#B89B6A;--hero-bg:rgba(243,237,226,.07);--hero-line:rgba(243,237,226,.2);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14110F;--fg:#F3EDE2;--surface:rgba(243,237,226,.06);--line:rgba(243,237,226,.2);--link:#B89B6A;--hero-bg:rgba(243,237,226,.07);--hero-line:rgba(243,237,226,.2);color-scheme:dark}
*{box-sizing:border-box}
html,body{height:auto}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-weight:400;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:1px solid var(--link);outline-offset:2px}
.ic{display:block;flex:none}
.muted{opacity:.62}
.side{border-right:1px solid var(--line);position:fixed;top:0;bottom:0;left:0;width:272px;background:var(--black);color:var(--ivory);display:flex;flex-direction:column;z-index:30;
padding-top:calc(28px + env(safe-area-inset-top,0px));padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));padding-left:env(safe-area-inset-left,0px);overflow-y:auto}
.wordmark{font-family:var(--serif);font-weight:300;text-transform:uppercase;letter-spacing:.5em;font-size:26px;padding:0 28px 26px;border-bottom:1px solid rgba(243,237,226,.14);margin:0 0 6px}
.wordmark small{display:block;font-family:var(--sans);font-weight:300;letter-spacing:.32em;font-size:10px;opacity:.55;margin-top:8px}
.grp{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;font-weight:300;opacity:.5;padding:22px 28px 8px}
.nav{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:9px 28px;font-weight:300;font-size:14.5px;letter-spacing:.02em;color:rgba(243,237,226,.74);border-left:1px solid transparent;transition:color .2s,background .2s,border-color .2s}
.nav .ic{opacity:.85}
.nav:hover{color:var(--ivory);background:rgba(243,237,226,.05)}
.nav[aria-current="page"]{color:var(--ivory);border-left-color:var(--gold);background:rgba(243,237,226,.06);font-weight:400}
.nav[aria-current="page"] .ic{color:var(--gold);opacity:1}
.scrim{position:fixed;inset:0;background:var(--black);opacity:0;pointer-events:none;transition:opacity .25s;z-index:25}
.main{margin-left:272px}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:8px;padding-block:18px;position:relative}
.burger{display:none}
.search{flex:1;display:flex;justify-content:flex-end;align-items:center;gap:8px;min-width:0}
.search input{width:100%;max-width:300px;background:transparent;border:0;border-bottom:1px solid var(--line);padding:7px 2px;font-weight:300;font-size:14px;border-radius:0;outline:none}
.search input:focus{border-bottom-color:var(--link)}
.sp{flex:1}
.icb{width:38px;height:38px;display:grid;place-items:center;border:1px solid transparent;transition:border-color .2s,color .2s;position:relative}
.icb:hover{border-color:var(--line);color:var(--link)}
.badge{position:absolute;top:5px;right:4px;width:6px;height:6px;background:var(--gold);border-radius:50%}
.btn{background:var(--fg);color:var(--bg);padding:10px 20px;border-radius:1px;font-size:13.5px;letter-spacing:.04em;transition:background .2s;display:inline-flex;align-items:center;gap:10px}
.btn:hover{background:var(--link)}
.btn.sec{background:transparent;color:var(--fg);border:1px solid var(--fg)}
.btn.sec:hover{background:var(--surface);color:var(--fg)}
.link{color:var(--link);font-size:13.5px;letter-spacing:.04em;border-bottom:1px solid var(--line);padding-bottom:1px;transition:border-color .2s}
.link:hover{border-bottom-color:var(--link)}
.panel{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:calc(100% - 6px);width:min(340px,calc(100vw - 32px));background:var(--bg);border:1px solid var(--line);z-index:20;padding:6px 0}
.panel h4{margin:0;padding:12px 18px 6px;font-weight:400;font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;opacity:.6}
.panel .it{display:flex;justify-content:space-between;gap:14px;padding:9px 18px;font-size:14px;border-top:1px solid var(--surface)}
.panel .it span:last-child{white-space:nowrap;font-style:italic;font-family:var(--serif);font-size:16px}
.page{padding-block:56px 96px}
.eyebrow{font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;font-weight:400;opacity:.6;margin:0 0 14px}
h1.t{font-family:var(--serif);font-weight:300;font-size:clamp(38px,6vw,60px);line-height:1.04;letter-spacing:.015em;margin:0;text-wrap:balance}
h1.t em{font-style:italic;font-weight:300}
h2.s{font-family:var(--serif);font-weight:400;font-size:26px;letter-spacing:.03em;margin:0}
.lead{font-weight:300;font-size:16.5px;max-width:52ch;margin:18px 0 0}
.hero{background:var(--hero-bg);color:var(--ivory);padding:44px clamp(22px,4vw,48px) 40px;margin-top:6px;border:1px solid var(--hero-line)}
.hero .eyebrow{color:var(--gold);opacity:1}
.hero .lead{opacity:.8}
.hero .acts{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.hero .btn{background:var(--ivory);color:var(--black)}
.hero .btn:hover{background:var(--gold)}
.hero .btn.sec{background:transparent;color:var(--ivory);border-color:rgba(243,237,226,.45)}
.hero .btn.sec:hover{background:rgba(243,237,226,.08)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);border-top:0;background:var(--surface)}
.stat{padding:28px clamp(18px,3vw,32px) 26px;border-right:1px solid var(--line);min-width:0}
.stat:last-child{border-right:0}
.stat .lab{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;opacity:.65;margin:0 0 14px}
.stat .big{font-family:var(--serif);font-weight:300;font-size:clamp(40px,5vw,56px);line-height:1;margin:0;font-variant-numeric:lining-nums tabular-nums}
.stat .sub{font-weight:300;font-size:14px;margin:12px 0 0;opacity:.75}
.bar{height:2px;background:var(--line);margin-top:16px;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--link);transition:width .5s ease}
.stat .bar{background:var(--bg)}
.secthead{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;margin:64px 0 8px}
.cats{border-top:1px solid var(--fg)}
.cat{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 24px;padding:22px 0;border-bottom:1px solid var(--line)}
.cat .n{font-family:var(--serif);font-size:24px;letter-spacing:.02em}
.cat .p{font-family:var(--serif);font-weight:300;font-size:34px;line-height:1;text-align:right;font-variant-numeric:lining-nums tabular-nums}
.cat .p small{font-family:var(--sans);font-size:13px;margin-left:2px}
.cat .meta{font-size:13.5px;font-weight:300;opacity:.75}
.cat .bar{grid-column:1/-1;margin-top:6px}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:34px 0 18px}
.seg{display:inline-flex;border:1px solid var(--line)}
.seg button{padding:8px 16px;font-size:13px;letter-spacing:.04em;font-weight:300;transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.seg button:not([aria-pressed="true"]):hover{background:var(--surface)}
.list{border-top:1px solid var(--fg)}
.row{display:grid;grid-template-columns:28px minmax(0,1fr) auto auto 34px;gap:6px 18px;align-items:center;padding:15px 0;border-bottom:1px solid var(--line)}
.row.led{grid-template-columns:minmax(0,1fr) auto auto 34px}
.chk{width:18px;height:18px;border:1px solid var(--fg);display:grid;place-items:center;color:var(--bg);border-radius:1px;transition:background .2s}
.chk:hover{background:var(--surface)}
.chk[aria-checked="true"]{background:var(--fg)}
.chk svg{opacity:0}
.chk[aria-checked="true"] svg{opacity:1}
.row .ttl{min-width:0;overflow-wrap:anywhere}
.row.done .ttl{text-decoration:line-through;opacity:.5}
.tag{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;opacity:.65;white-space:nowrap}
.due{font-family:var(--serif);font-style:italic;font-size:17px;white-space:nowrap;text-align:right;min-width:92px;font-variant-numeric:lining-nums tabular-nums}
.due.late::before{content:"";display:inline-block;width:10px;height:1px;background:var(--gold);margin-right:8px;vertical-align:middle}
.amt{font-size:15px;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap;min-width:110px}
.del{width:30px;height:30px;display:grid;place-items:center;opacity:.5;transition:opacity .2s,color .2s}
.del:hover{opacity:1;color:var(--link)}
.empty{padding:56px 0;text-align:center;border-bottom:1px solid var(--line)}
.empty p{font-family:var(--serif);font-style:italic;font-size:22px;margin:0 0 6px}
.empty span{font-weight:300;font-size:14px;opacity:.7}
.note{font-size:12.5px;font-weight:300;opacity:.65;font-style:italic;font-family:var(--serif);font-size:15px}
.dlg{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(20,17,15,.55)}
.card{background:var(--bg);border:1px solid var(--line);width:min(460px,100%);padding:30px clamp(20px,4vw,34px) 28px;max-height:100%;overflow:auto}
.card h3{font-family:var(--serif);font-weight:300;font-size:32px;margin:0 0 20px;letter-spacing:.02em}
.f{display:flex;flex-direction:column;gap:6px;margin-top:18px}
.f label{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;opacity:.65}
.f input,.f select{background:transparent;border:0;border-bottom:1px solid var(--line);padding:8px 2px;border-radius:0;outline:none;font-weight:300;font-size:16px;width:100%}
.f input:focus,.f select:focus{border-bottom-color:var(--link)}
.f select option{background:var(--bg);color:var(--fg)}
.acts2{display:flex;gap:10px;justify-content:flex-end;margin-top:28px;flex-wrap:wrap}
.soon{padding:64px 0 0;border-top:1px solid var(--fg);margin-top:40px}
@media (max-width:900px){
.side{transform:translateX(-102%);transition:transform .28s ease;width:min(300px,86vw)}
body.open .side{transform:none}
body.open .scrim{opacity:.55;pointer-events:auto}
.main{margin-left:0}
.burger{display:grid}
.page{padding-block:36px 72px}
.stats{grid-template-columns:1fr}
.stat{border-right:0;border-bottom:1px solid var(--line)}
.stat:last-child{border-bottom:0}
.row{grid-template-columns:28px minmax(0,1fr) 34px}
.row .tag,.row .due{grid-column:2;text-align:left;min-width:0}
.row .del{grid-column:3;grid-row:1}
.row.led{grid-template-columns:minmax(0,1fr) 34px}
.row.led .amt{grid-column:1;text-align:left}
.row.led .del{grid-column:2;grid-row:1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
:root{--r-lg:28px;--r-md:20px}
.btn,.btn.sec{border-radius:999px;padding:11px 22px}
.icb{border-radius:50%}
.icb:hover{border-color:transparent;background:var(--surface)}
.search input{border:1px solid var(--line);border-radius:999px;padding:9px 18px}
.search input:focus{border-color:var(--link)}
.panel{border-radius:var(--r-md);overflow:hidden}
.nav{width:calc(100% - 24px);margin:2px 12px;padding:10px 16px;border-left:0;border-radius:14px}
.nav[aria-current="page"]{border-left:0}
.hero{border:0;border-radius:var(--r-lg)}
.stats{gap:12px;background:transparent;border:0!important;margin-top:12px}
.stat{background:var(--surface);border:0;border-radius:var(--r-md)}
.bar{height:4px;border-radius:99px;overflow:hidden}
.stat .bar{background:var(--line)}
.cats{border-top:0;display:grid;gap:10px}
.cat{background:var(--surface);border:0;border-radius:var(--r-md);padding:20px 24px}
.seg{border-radius:999px;overflow:hidden;padding:3px;gap:2px}
.seg button{border-radius:999px}
.list{border-top:0;display:grid;gap:8px}
.row{background:var(--surface);border:0;border-radius:var(--r-md);padding:14px 20px}
.chk{border-radius:50%}
.tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:3px 12px;letter-spacing:.14em}
.row>.tag{justify-self:start}
.ttl .tag{display:table;border:0;padding:0;margin-top:2px}
.del{border-radius:50%}
.del:hover{background:var(--line)}
.empty{background:var(--surface);border:0;border-radius:var(--r-md)}
.card{border:0;border-radius:var(--r-lg)}
.f input,.f select{border:1px solid var(--line);border-radius:14px;padding:11px 16px}
.f input:focus,.f select:focus{border-color:var(--link)}
.soon{border-top:0;padding-top:24px}
</style>
</head>

['Pilotage',[['dashboard','Tableau de bord','home'],['tasks','Tâches','tasks'],['goals','Objectifs','target'],['agenda','Agenda','cal']]],
['Opérations',[['stock','Stock','store'],['orders','Commandes','truck'],['products','Produits','box'],['contacts','Contacts','users']]],
['Gestion',[['expenses','Dépenses','euro'],['income','Recettes','wallet'],['productcost','Coût produit','table'],['cloud','Cloud','cloud'],['docs','Docs & process','file'],['watch','Veille e-commerce','news'],['journal','Journal','pulse']]]
];
const LABEL={};NAV.forEach(g=>g[1].forEach(i=>LABEL[i[0]]=i[1]));
const CATS=['Marketing','Sourcing','Produit','Divers'];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MONEY=new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'});
const money=n=>MONEY.format(Math.abs(n)===0?0:n);
const signed=n=>n===0?money(0):(n>0?'+ ':'− ')+MONEY.format(Math.abs(n));
const startOf=d=>{const x=new Date(d);x.setHours(0,0,0,0);return x};
const TODAY=startOf(new Date());
const iso=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const off=n=>{const d=new Date(TODAY);d.setDate(d.getDate()+n);return iso(d)};
const diff=s=>Math.round((startOf(s+'T00:00:00')-TODAY)/864e5);
const uid=()=>Math.random().toString(36).slice(2,10);
const MONTH=new Intl.DateTimeFormat('fr-FR',{month:'long'}).format(TODAY);
const MKEY=iso(TODAY).slice(0,7);
function seed(){
const T=(t,cat,due,done)=>({id:uid(),t,cat,due,done:!!done});
return {sample:true,budget:1000,tasks:[
T('Définir le plan de contenu sur 30 jours','Marketing',off(-20),1),T('Valider le moodboard de marque','Marketing',off(-18),1),T('Créer les comptes sociaux','Marketing',off(-15),1),
T('Tourner la vidéo de lancement','Marketing',off(-3)),T('Préparer les trois publicités','Marketing',off(-5)),T('Rédiger les scripts créateurs','Marketing',off(-2)),T('Programmer les publications de la semaine 1','Marketing',off(-1)),T('Envoyer le brief aux créateurs','Marketing',off(-7)),
T('Comparer trois fournisseurs','Sourcing',off(-16),1),T('Demander les échantillons','Sourcing',off(-12),1),T('Négocier le prix unitaire','Sourcing',off(-4)),T('Valider le délai de livraison','Sourcing',off(6)),
T('Finaliser le design produit','Produit',off(-14),1),T('Choisir les coloris','Produit',off(-11),1),T('Valider l’emballage','Produit',off(-9),1),
T('Mettre à jour le tableau de budget','Divers',off(-2)),T('Classer les factures','Divers',off(-3)),T('Répondre aux messages en attente','Divers',off(-1)),T('Ouvrir le compte professionnel','Divers',off(-6))
],ledger:[]};
}
let S;
try{S=JSON.parse(localStorage.getItem('dusk-space-v1')||'null')}catch(e){S=null}
if(!S||!S.tasks)S=seed();
const save=()=>{try{localStorage.setItem('dusk-space-v1',JSON.stringify(S))}catch(e){}};
let view='dashboard',filter='open',q='';
const late=t=>!t.done&&diff(t.due)<0;
const lateTasks=()=>S.tasks.filter(late).sort((a,b)=>a.due<b.due?-1:1);
const monthLedger=k=>S.ledger.filter(l=>l.kind===k&&l.date.slice(0,7)===MKEY).reduce((a,l)=>a+l.amount,0);
function dueLabel(t){
const d=diff(t.due);
if(t.done)return{c:'',s:'Terminée'};
if(d<0)return{c:'late',s:'− '+(-d)+' j'};
if(d===0)return{c:'',s:'Aujourd’hui'};
return{c:'',s:'+ '+d+' j'};
}
function renderNav(){
$('#nav').innerHTML=NAV.map(g=>'<div class="grp">'+g[0]+'</div>'+g[1].map(i=>'<button class="nav" data-view="'+i[0]+'"'+(view===i[0]?' aria-current="page"':'')+'>'+ic(i[2],18)+'<span>'+i[1]+'</span></button>').join('')).join('');
}
function renderBell(){
const L=lateTasks();
$('#bbell').innerHTML=ic('bell',19)+(L.length?'<span class="badge"></span>':'');
$('#bellpanel').innerHTML='<h4>Tâches en retard</h4>'+(L.length?L.slice(0,6).map(t=>'<div class="it"><span>'+esc(t.t)+'</span><span>− '+(-diff(t.due))+' j</span></div>').join('')+(L.length>6?'<div class="it"><span class="muted">et '+(L.length-6)+' autres</span><span></span></div>':''):'<div class="it"><span class="muted">Aucune tâche en retard.</span><span></span></div>');
}
function renderMain(){
const m=$('#main');
if(view==='dashboard')m.innerHTML=dash();
else if(view==='tasks')m.innerHTML=tasksView();
else if(view==='expenses')m.innerHTML=ledgerView('dep');
else if(view==='income')m.innerHTML=ledgerView('rec');
else m.innerHTML=soon();
renderNav();renderBell();
}
function dash(){
const open=S.tasks.filter(t=>!t.done),L=lateTasks();
const dep=monthLedger('dep'),rec=monthLedger('rec'),res=rec-dep;
const pct=Math.min(100,S.budget?dep/S.budget*100:0);
const rows=CATS.map(c=>{
const ts=S.tasks.filter(t=>t.cat===c),done=ts.filter(t=>t.done).length,o=ts.length-done,l=ts.filter(late).length;
const p=ts.length?Math.round(done/ts.length*100):0;
return '<div class="cat"><div class="n">'+c+'</div><div class="p">'+p+'<small>%</small></div><div class="meta">'+o+' ouverte'+(o>1?'s':'')+(l?', '+l+' en retard':'')+'</div><div class="bar"><i style="width:'+p+'%"></i></div></div>';
}).join('');
return '<p class="eyebrow">Tableau de bord</p>'+
'<section class="hero"><p class="eyebrow">'+new Intl.DateTimeFormat('fr-FR',{weekday:'long',day:'numeric',month:'long'}).format(TODAY)+'</p>'+
'<h1 class="t">Bonjour, <em>Adam</em>.</h1>'+
'<p class="lead">'+(open.length?(open.length+' tâche'+(open.length>1?'s':'')+' vous attend'+(open.length>1?'ent':'')+(L.length?', dont '+L.length+' en retard.':'.')):'Aucune tâche ouverte. Tout est à jour.')+'</p>'+
'<div class="acts"><button class="btn" data-view="tasks">Ouvrir les tâches</button><button class="btn sec" data-add="task">'+ic('plus',16)+'Nouvelle tâche</button></div></section>'+
'<section class="stats"><div class="stat"><p class="lab">En retard</p><p class="big">'+L.length+'</p><p class="sub">À traiter en priorité</p></div>'+
'<div class="stat"><p class="lab">Résultat '+MONTH+'</p><p class="big">'+signed(res)+'</p><p class="sub">'+money(rec)+' de recettes, '+money(dep)+' de dépenses</p></div>'+
'<div class="stat"><p class="lab">Budget '+MONTH+'</p><p class="big">'+money(dep)+'</p><p class="sub">dépensés sur '+money(S.budget)+' de budget</p><div class="bar"><i style="width:'+pct+'%"></i></div></div></section>'+
'<div class="secthead"><h2 class="s">Avancement par catégorie</h2><button class="link" data-view="tasks">Ouvrir le tableau des tâches</button></div>'+
'<div class="cats">'+rows+'</div>';
}
function tasksView(){
let ts=S.tasks.slice();
if(q)ts=ts.filter(t=>(t.t+' '+t.cat).toLowerCase().includes(q.toLowerCase()));
if(filter==='open')ts=ts.filter(t=>!t.done);
else if(filter==='late')ts=ts.filter(late);
else if(filter==='done')ts=ts.filter(t=>t.done);
ts.sort((a,b)=>(a.done-b.done)||(a.due<b.due?-1:1));
const seg=[['open','Ouvertes'],['late','En retard'],['done','Terminées'],['all','Toutes']].map(f=>'<button data-filter="'+f[0]+'" aria-pressed="'+(filter===f[0])+'">'+f[1]+'</button>').join('');
const list=ts.length?ts.map(t=>{const d=dueLabel(t);return '<div class="row'+(t.done?' done':'')+'"><button class="chk" role="checkbox" aria-checked="'+t.done+'" aria-label="Marquer comme terminée : '+esc(t.t)+'" data-toggle="'+t.id+'">'+ic('check',12)+'</button><div class="ttl">'+esc(t.t)+'</div><div class="tag">'+esc(t.cat)+'</div><div class="due '+d.c+'">'+d.s+'</div><button class="del" aria-label="Supprimer" data-del="'+t.id+'">'+ic('trash',16)+'</button></div>'}).join(''):'<div class="empty"><p>Rien à afficher.</p><span>Ajoutez une tâche avec le bouton +.</span></div>';
return '<p class="eyebrow">Pilotage</p><h1 class="t">Tâches</h1>'+
'<div class="tools"><div class="seg" role="group" aria-label="Filtrer">'+seg+'</div><span class="sp"></span><button class="btn" data-add="task">'+ic('plus',16)+'Nouvelle tâche</button></div>'+
(q?'<p class="note">Recherche : « '+esc(q)+' »</p>':'')+
'<div class="list">'+list+'</div>'+
(S.sample?'<p class="note" style="margin-top:22px">Ces tâches sont des exemples. <button class="link" data-clear="1">Effacer les exemples</button></p>':'');
}
function ledgerView(kind){
const dep=kind==='dep',title=dep?'Dépenses':'Recettes';
const items=S.ledger.filter(l=>l.kind===kind).sort((a,b)=>a.date<b.date?1:-1);
const tot=monthLedger(kind);
const list=items.length?items.map(l=>'<div class="row led"><div class="ttl">'+esc(l.label)+'<div class="tag" style="margin-top:2px">'+new Intl.DateTimeFormat('fr-FR',{day:'numeric',month:'long',year:'numeric'}).format(new Date(l.date+'T00:00:00'))+'</div></div><div class="amt">'+(dep?'− ':'+ ')+money(l.amount)+'</div><span></span><button class="del" aria-label="Supprimer" data-delled="'+l.id+'">'+ic('trash',16)+'</button></div>').join(''):'<div class="empty"><p>Aucune '+(dep?'dépense':'recette')+' enregistrée.</p><span>Utilisez le bouton + pour en ajouter une.</span></div>';
return '<p class="eyebrow">Gestion</p><h1 class="t">'+title+'</h1>'+
'<section class="stats" style="border-top:1px solid var(--line);margin-top:34px"><div class="stat"><p class="lab">Total '+MONTH+'</p><p class="big">'+money(tot)+'</p>'+(dep?'<p class="sub">sur '+money(S.budget)+' de budget</p><div class="bar"><i style="width:'+Math.min(100,tot/S.budget*100)+'%"></i></div>':'<p class="sub">encaissés ce mois-ci</p>')+'</div><div class="stat"><p class="lab">Écritures</p><p class="big">'+items.length+'</p><p class="sub">au total</p></div><div class="stat" style="display:flex;align-items:flex-end"><button class="btn" data-add="'+kind+'">'+ic('plus',16)+(dep?'Nouvelle dépense':'Nouvelle recette')+'</button></div></section>'+
'<div class="secthead" style="margin-top:44px"><h2 class="s">Journal des '+(dep?'dépenses':'recettes')+'</h2></div><div class="list">'+list+'</div>';
}
function soon(){
const l=LABEL[view];
return '<p class="eyebrow">Section</p><h1 class="t">'+esc(l)+'</h1><div class="soon"><p class="lead" style="margin:0">Cette section reprend l’identité DUSK. Ses données seront affichées ici dès qu’elle sera reliée à votre application.</p></div>';
}
let kind='task';
function fields(){
const k=kind;
$('#dt').textContent=k==='task'?'Nouvelle tâche':k==='dep'?'Nouvelle dépense':'Nouvelle recette';
$('#kindseg').innerHTML=[['task','Tâche'],['dep','Dépense'],['rec','Recette']].map(a=>'<button type="button" data-kind="'+a[0]+'" aria-pressed="'+(kind===a[0])+'">'+a[1]+'</button>').join('');
$('#fields').innerHTML=k==='task'
?'<div class="f"><label for="f1">Titre</label><input id="f1" required maxlength="120" autocomplete="off"></div><div class="f"><label for="f2">Catégorie</label><select id="f2">'+CATS.map(c=>'<option>'+c+'</option>').join('')+'</select></div><div class="f"><label for="f3">Échéance</label><input id="f3" type="date" value="'+off(7)+'" required></div>'
:'<div class="f"><label for="f1">Libellé</label><input id="f1" required maxlength="120" autocomplete="off"></div><div class="f"><label for="f2">Montant (€)</label><input id="f2" type="number" inputmode="decimal" min="0.01" step="0.01" required></div><div class="f"><label for="f3">Date</label><input id="f3" type="date" value="'+iso(TODAY)+'" required></div>';
}
function openDlg(k){kind=k;fields();$('#dlg').hidden=false;setTimeout(()=>{const f=$('#f1');f&&f.focus()},30)}
const closeDlg=()=>{$('#dlg').hidden=true};
function $(s){return document.querySelector(s)}
const setMenu=o=>document.body.classList.toggle('open',o);
document.addEventListener('click',e=>{
const t=e.target.closest('[data-view],[data-filter],[data-toggle],[data-del],[data-delled],[data-add],[data-kind],[data-clear]');
const bell=e.target.closest('#bbell');
if(!bell&&!e.target.closest('#bellpanel')){$('#bellpanel').hidden=true;$('#bbell').setAttribute('aria-expanded','false')}
if(!t)return;
const d=t.dataset;
if(d.view){view=d.view;setMenu(false);renderMain();window.scrollTo(0,0)}
else if(d.filter){filter=d.filter;renderMain()}
else if(d.toggle){const x=S.tasks.find(a=>a.id===d.toggle);if(x){x.done=!x.done;save();renderMain()}}
else if(d.del){S.tasks=S.tasks.filter(a=>a.id!==d.del);save();renderMain()}
else if(d.delled){S.ledger=S.ledger.filter(a=>a.id!==d.delled);save();renderMain()}
else if(d.add){openDlg(d.add)}
else if(d.kind){kind=d.kind;fields()}
else if(d.clear){S.tasks=[];S.sample=false;save();renderMain()}
});
$('#badd').addEventListener('click',()=>openDlg(view==='expenses'?'dep':view==='income'?'rec':'task'));
$('#dcancel').addEventListener('click',closeDlg);
$('#dlg').addEventListener('click',e=>{if(e.target.id==='dlg')closeDlg()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDlg();setMenu(false);$('#bellpanel').hidden=true}});
$('#form').addEventListener('submit',e=>{
e.preventDefault();
const a=$('#f1').value.trim(),b=$('#f2').value,c=$('#f3').value;
if(!a)return;
if(kind==='task'){S.tasks.push({id:uid(),t:a,cat:b,due:c,done:false});view='tasks';filter='open'}
else{const n=parseFloat(b);if(!(n>0))return;S.ledger.push({id:uid(),kind:kind,label:a,amount:n,date:c});view=kind==='dep'?'expenses':'income'}
save();closeDlg();renderMain();
});
$('#burger').addEventListener('click',()=>setMenu(true));
$('#scrim').addEventListener('click',()=>setMenu(false));
$('#bbell').addEventListener('click',e=>{e.stopPropagation();const p=$('#bellpanel');p.hidden=!p.hidden;$('#bbell').setAttribute('aria-expanded',String(!p.hidden))});
$('#bsearch').addEventListener('click',()=>{
const b=$('#searchbox'),open=b.hidden;
b.hidden=!open;$('#spacer').hidden=open;
if(open)$('#q').focus();else{$('#q').value='';q='';renderMain()}
});
$('#q').addEventListener('input',e=>{q=e.target.value.trim();if(view!=='tasks'){view='tasks';filter='all'}renderMain()});
$('#burger').innerHTML=ic('menu',20);
$('#bsearch').innerHTML=ic('search',19);
$('#badd').innerHTML=ic('plus',16)+'<span>Ajouter</span>';
const root=document.documentElement;
const mq=window.matchMedia?window.matchMedia('(prefers-color-scheme: dark)'):null;
const isDark=()=>root.dataset.theme?root.dataset.theme==='dark':!!(mq&&mq.matches);
const paintTheme=()=>{$('#btheme').innerHTML=ic(isDark()?'sun':'moon',19);$('#btheme').setAttribute('aria-label',isDark()?'Passer en mode clair':'Passer en mode sombre')};
try{const th=localStorage.getItem('dusk-theme');if(th)root.dataset.theme=th}catch(e){}
$('#btheme').addEventListener('click',()=>{const n=isDark()?'light':'dark';root.dataset.theme=n;try{localStorage.setItem('dusk-theme',n)}catch(e){}paintTheme()});
if(mq&&mq.addEventListener)mq.addEventListener('change',paintTheme);
paintTheme();
renderMain();
})();
</script>
</body>
</html>
