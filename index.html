<style>
:root{--ivory:#F3EDE2;--black:#14110F;--gold:#B89B6A;--serif:'Cormorant Garamond',Georgia,serif;--sans:'Jost','Helvetica Neue',Arial,sans-serif;--bg:#F3EDE2;--fg:#14110F;--surface:#E3D8C3;--line:#CDBE9D;--link:#7A6238;--hero-bg:#14110F;--r:20px;color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=dark]{--bg:#14110F;--fg:#F3EDE2;--surface:rgba(243,237,226,.07);--line:rgba(243,237,226,.22);--link:#C9AD7B;--hero-bg:rgba(243,237,226,.08);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:400 15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:left}

.ic{display:block;flex:none}
.muted{opacity:.75}

.main{margin-left:272px}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{position:sticky;top:0;z-index:15;background:var(--bg);border-bottom:1px solid var(--line)}

.burger{display:none}
.search{flex:1;display:flex;justify-content:flex-end;min-width:0}

.sp{flex:1}
.icb{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;position:relative}

.badge{position:absolute;top:7px;right:7px;width:7px;height:7px;background:var(--gold);border-radius:50%}
.btn{background:var(--fg);color:var(--bg);padding:11px 22px;border-radius:999px;font-size:14px;letter-spacing:.03em;display:inline-flex;align-items:center;gap:10px;transition:background .2s}
.btn:hover{background:var(--link)}
.btn.sec{background:transparent;color:var(--fg);border:1px solid var(--fg)}
.btn.sec:hover{background:var(--surface)}
.link{color:var(--link);font-size:14px;border-bottom:1px solid var(--line);padding-bottom:1px}
.link:hover{border-bottom-color:var(--link)}
.panel{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:calc(100% - 6px);width:min(340px,calc(100vw - 32px));background:var(--bg);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;z-index:20;padding:6px 0}

.panel .it{display:flex;justify-content:space-between;gap:14px;width:100%;padding:10px 18px;font-size:14px;border-top:1px solid var(--surface)}
.panel button.it:hover{background:var(--surface)}
.panel .it span:last-child{white-space:nowrap;font:italic 16px var(--serif)}
.page{padding-block:44px 96px}
.eyebrow{font-size:11px;letter-spacing:.24em;text-transform:uppercase;opacity:.75;margin:0 0 14px}
h1.t{font-family:var(--serif);font-weight:300;font-size:clamp(38px,6vw,60px);line-height:1.04;margin:0;text-wrap:balance}
h1.t em{font-style:italic}
h2.s{font-family:var(--serif);font-weight:400;font-size:26px;margin:0}
.lead{font-weight:300;font-size:16.5px;max-width:52ch;margin:18px 0 0}
.hero{background:var(--hero-bg);color:var(--ivory);padding:44px clamp(22px,4vw,48px) 40px;margin-top:6px;border-radius:28px}

.hero .lead{opacity:.85}
.hero .acts{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.hero .btn{background:var(--ivory);color:var(--black)}
.hero .btn:hover{background:var(--gold)}
.hero .btn.sec{background:transparent;color:var(--ivory);border-color:rgba(243,237,226,.5)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:12px}
.stat{padding:28px clamp(18px,3vw,32px) 26px;min-width:0;background:var(--surface);border-radius:var(--r)}
.stat .lab{font-size:11px;letter-spacing:.2em;text-transform:uppercase;opacity:.75;margin:0 0 14px}
.stat .big{font:300 clamp(36px,5vw,52px)/1 var(--serif);margin:0;font-variant-numeric:lining-nums tabular-nums}

.cats{display:grid;gap:10px}

.cat .meta{font-size:14px;font-weight:300;opacity:.8}
.cat .bar{grid-column:1/-1;margin-top:6px}
.up{display:flex;justify-content:space-between;gap:12px;width:100%;padding:13px 20px;background:var(--surface);border-radius:var(--r);margin-bottom:8px}

.list{display:grid;gap:8px}
.row{display:grid;grid-template-columns:28px minmax(0,1fr) auto auto 34px;gap:6px 18px;align-items:center;padding:14px 20px;background:var(--surface);border-radius:var(--r)}
.row.led{grid-template-columns:minmax(0,1fr) auto 34px}
.chk{width:20px;height:20px;border:1px solid var(--fg);border-radius:50%;display:grid;place-items:center;color:var(--bg)}
.chk[aria-checked=true]{background:var(--fg)}
.chk svg{opacity:0}
.chk[aria-checked=true] svg{opacity:1}
.ttl{min-width:0;overflow-wrap:anywhere}
.ttl:hover{color:var(--link)}
.row.done .ttl{text-decoration:line-through;opacity:.6}
.tag{font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.8;white-space:nowrap;border:1px solid var(--line);border-radius:999px;padding:3px 12px;justify-self:start}
.ttl+.sub2{display:block;font-size:12px;opacity:.75;margin-top:2px}
.due{font:italic 17px var(--serif);white-space:nowrap;text-align:right;min-width:110px}
.due.late{color:var(--link);font-weight:400}
.due.late::before{content:"";display:inline-block;width:10px;height:1px;background:var(--gold);margin-right:8px;vertical-align:middle}
.amt{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap;min-width:110px}
.del{width:32px;height:32px;display:grid;place-items:center;border-radius:50%;opacity:.65}
.del:hover{opacity:1;background:var(--line)}
.empty{padding:56px 0;text-align:center;background:var(--surface);border-radius:var(--r)}
.empty p{font:italic 22px var(--serif);margin:0 0 6px}
.empty span,.note{font-weight:300;font-size:14px;opacity:.8}
.note{font:italic 15px var(--serif)}
.dlg{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(20,17,15,.55)}
.card{background:var(--bg);width:min(460px,100%);padding:30px clamp(20px,4vw,34px) 28px;max-height:100%;overflow:auto;border-radius:28px}
.card h3{font:300 32px var(--serif);margin:0 0 20px}
.f{display:flex;flex-direction:column;gap:6px;margin-top:18px}
.f label{font-size:11px;letter-spacing:.2em;text-transform:uppercase;opacity:.75}
.f input,.f select,.f textarea{background:transparent;border:1px solid var(--line);border-radius:14px;padding:11px 16px;font-weight:300;font-size:16px;width:100%;outline:none}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--link)}
.f textarea{resize:vertical}
.f select option{background:var(--bg);color:var(--fg)}
.acts2{display:flex;gap:10px;justify-content:flex-end;margin-top:28px;flex-wrap:wrap}
.soon{padding-top:24px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;gap:16px;align-items:center;background:var(--fg);color:var(--bg);padding:12px 20px;border-radius:999px;font-size:14px;max-width:calc(100vw - 32px)}
#toast button{color:var(--gold);text-decoration:underline;white-space:nowrap}
@media(max-width:900px){
.side{transform:translateX(-102%);transition:transform .28s;width:min(300px,86vw)}
body.open .side{transform:none}
body.open .scrim{opacity:.55;pointer-events:auto}
.main{margin-left:0}.burger{display:grid}.page{padding-block:32px 72px}
.stats{grid-template-columns:1fr}
.row{grid-template-columns:28px minmax(0,1fr) 34px}
.row .tag,.row .due{grid-column:2;text-align:left;min-width:0}
.row .del{grid-column:3;grid-row:1}
.row.led{grid-template-columns:minmax(0,1fr) 34px}
.row.led .amt{grid-column:1;text-align:left}
.row.led .del{grid-column:2;grid-row:1}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

else if(d.cdel){const p=d.cdel.split(':');mutate('Élément supprimé',()=>{S.c[p[0]]=S.c[p[0]].filter(a=>a.id!==p[1])})}
});
$('#imp').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const r=new FileReader();r.onload=()=>{let n=null;try{n=norm(JSON.parse(r.result))}catch(x){}if(!n){toast('Fichier invalide : import annulé.');return}mutate('Données importées',()=>{S=n})};r.readAsText(f)});
$('#badd').addEventListener('click',()=>openDlg(COLL[view]?view:view==='expenses'?'dep':view==='income'?'rec':'task'));
$('#dcancel').addEventListener('click',closeDlg);
$('#dlg').addEventListener('click',e=>{if(e.target.id==='dlg')closeDlg()});
document.addEventListener('keydown',e=>{
if(e.key==='Escape'){closeDlg();setMenu(false);hideBell()}
else if(e.key==='Tab'&&!$('#dlg').hidden){const f=[...$('#form').querySelectorAll('button,input,select')].filter(x=>!x.disabled&&!x.closest('[hidden]'));if(!f.length)return;const a=f[0],z=f[f.length-1];
if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}
});
$('#form').addEventListener('submit',e=>{
e.preventDefault();
if(COLL[kind]){csubmit();return}
const v=id=>{const n=$('#'+id);return n?n.value.trim():''},a=v('f1'),b=v('f2'),c=v('f3');let nv=null;
if(kind==='budget'){const n=parseFloat(b);if(!(n>=0))return;S.budget=n}
else if(kind==='task'){if(!a||!c)return;
if(editId){const t=S.tasks.find(x=>x.id===editId);if(t){t.t=a;t.cat=b;t.due=c}}else{S.tasks.push({id:uid(),t:a,cat:b,due:c,done:false});nv='tasks';filter='open'}}
else{const n=parseFloat(b);if(!a||!c||!(n>0))return;
if(editId){const l=S.ledger.find(x=>x.id===editId);if(l){l.label=a;l.amount=n;l.date=c}}else{S.ledger.push({id:uid(),kind:kind,label:a,amount:n,date:c});nv=kind==='dep'?'expenses':'income'}}
save();closeDlg();if(nv&&nv!==view)setView(nv);else renderMain();
});
$('#burger').addEventListener('click',()=>setMenu(true));
$('#scrim').addEventListener('click',()=>setMenu(false));
$('#bbell').addEventListener('click',e=>{e.stopPropagation();const p=$('#bellpanel');p.hidden=!p.hidden;$('#bbell').setAttribute('aria-expanded',String(!p.hidden))});
$('#bsearch').addEventListener('click',()=>{const b=$('#searchbox'),o=b.hidden;b.hidden=!o;$('#spacer').hidden=o;if(o)$('#q').focus();else{$('#q').value='';q='';renderMain()}});
$('#q').addEventListener('input',e=>{q=e.target.value.trim();if(view!=='tasks'){filter='all';setView('tasks')}else renderMain()});
$('#burger').innerHTML=ic('menu',20);$('#bsearch').innerHTML=ic('search',19);$('#badd').innerHTML=ic('plus',16)+'<span>Ajouter</span>';
const root=document.documentElement,mq=matchMedia('(prefers-color-scheme: dark)');
let stored=null;try{stored=localStorage.getItem('dusk-theme')}catch(e){}
const isDark=()=>root.dataset.theme==='dark';
const paintTheme=()=>{$('#btheme').innerHTML=ic(isDark()?'sun':'moon',19);$('#btheme').setAttribute('aria-label',isDark()?'Passer en mode clair':'Passer en mode sombre');$('#tc').content=isDark()?'#14110F':'#F3EDE2'};
$('#btheme').addEventListener('click',()=>{const n=isDark()?'light':'dark';root.dataset.theme=n;stored=n;try{localStorage.setItem('dusk-theme',n)}catch(e){}paintTheme()});
mq.addEventListener('change',()=>{if(!stored){root.dataset.theme=mq.matches?'dark':'light';paintTheme()}});
mqM.addEventListener('change',syncSide);
const tick=()=>{const n=startOf(new Date());if(+n!==+TODAY){setDay();renderMain()}};
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});setInterval(tick,6e4);
paintTheme();syncSide();renderMain();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
})();
</script>
</body>
</html>
